# .github/workflows/publish-python-package.yml
# Reusable workflow: builds a Python package from the given directory and
# publishes it to PyPI via trusted publishing (OIDC, no stored secrets).
name: Publish Python package to PyPI

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory containing the package's pyproject.toml
        required: true
        type: string
      artifact-name:
        description: Name for the intermediate build artifact
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build

      - name: Build distribution
        working-directory: ${{ inputs.package-dir }}
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.package-dir }}/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
