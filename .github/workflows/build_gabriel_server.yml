name: Build and push Gabriel server

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'server/**'
      - 'protocol/python/**'
jobs:
  integration-test:
    uses: ./.github/workflows/integration_test.yml

  build-and-push:
    needs: integration-test
    uses: ./.github/workflows/deploy-docker-img.yml
    with:
      name: gabriel-server
      dockerfile: server/Dockerfile
      ctx: server
      build_contexts: protocol=protocol/python
      free_disk_space: true
    secrets: inherit
