[package]
name = "gabriel-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs a Gabriel server that remote clients reach over the network"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gabriel = { path = "../rust" }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
signal-hook = "0.4.5"
