# On a Tachyon: a camera at 30 fps feeds YOLO, which passes frames with objects to PatchCore.
# Both are the QNN inference server running as external Gabriel engines on the one NPU, so start
# them before the run:
#
#   qnn-sample-app --model <yolo.so> --backend libQnnHtp.so --gabriel_engine yolo
#   qnn-sample-app --model <patchcore.so> --backend libQnnHtp.so --gabriel_engine patchcore \
#       --gabriel_task embed
#
# The camera replays the JPEG files in ./frames.
name = "tachyon-detect-embed"
duration = "30s"
drain = "3s"
seed = 1

[[flow.producers]]
name = "camera"

[[flow.engines]]
name = "yolo"
location = "local"

[[flow.engines]]
name = "patchcore"
location = "local"

[[flow.edges]]
from = "camera"
to = "yolo"
timeout = "1s"

[[flow.edges]]
from = "yolo"
to = "patchcore"
timeout = "2s"

[producers.camera]
rate = 30
frames = "frames"

[engines.yolo]
external = true
accelerator = "npu"

[engines.patchcore]
external = true
accelerator = "npu"
