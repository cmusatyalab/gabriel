# On a Tachyon: a camera at 30 fps publishes decoded 720p frames to YOLO on the device, which
# passes frames with objects to a detector on an edge server, over the network. YOLO is the QNN
# inference server as an external engine, on the fast cores; the detector runs on the edge server,
# which runs gabriel-server. Start them before the run:
#
#   edge:   gabriel-server --identity-dir identity --engine detector
#   device: taskset -c 4-7 qnn-sample-app --model <yolo.so> --backend libQnnHtp.so \
#               --gabriel_engine yolo
#
# Copy the edge server's identity/certificate.der to the device, next to this file's run
# directory. Make the frames with raw_frames.py, as tachyon-detect-raw says.
name = "tachyon-offload"
duration = "30s"
drain = "3s"
seed = 1

[[flow.producers]]
name = "camera"

[[flow.engines]]
name = "yolo"
location = "local"

[[flow.engines]]
name = "detector"
location = "remote"

[[flow.edges]]
from = "camera"
to = "yolo"
timeout = "1s"

[[flow.edges]]
from = "yolo"
to = "detector"
timeout = "2s"

[producers.camera]
rate = 30
frames = "frames-720p/raw"
input_type = "steeleagle_protocol.v1.messages.telemetry.RawFrame"

[engines.yolo]
external = true
accelerator = "npu"

[engines.detector]
external = true
accelerator = "gpu"

[remote]
# gs25450's public address.
addr = "128.2.211.57:4433"
certificate = "certificate.der"
