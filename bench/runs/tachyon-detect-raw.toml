# On a Tachyon: as tachyon-detect, but the camera publishes decoded 720p frames, so YOLO skips
# decoding. Start the engine as tachyon-detect says. Make the frames with raw_frames.py:
#
#   uv run bench/raw_frames.py --proto-path <dir with steeleagle_protocol/> --out frames-720p \
#       frames/*.png
#
# tachyon-detect-jpeg is the same run with JPEGs of the same pixels.
name = "tachyon-detect-raw"
duration = "30s"
drain = "3s"
seed = 1

[[flow.producers]]
name = "camera"

[[flow.engines]]
name = "yolo"
location = "local"

[[flow.edges]]
from = "camera"
to = "yolo"
timeout = "1s"

[producers.camera]
rate = 30
frames = "frames-720p/raw"
input_type = "steeleagle_protocol.v1.messages.telemetry.RawFrame"

[engines.yolo]
external = true
accelerator = "npu"
