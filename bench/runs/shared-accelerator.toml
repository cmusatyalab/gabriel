# slow-end, but A and B share one accelerator, as on-drone engines sharing one NPU do. Push wastes
# no work then, but A holds each frame while B has the accelerator.
name = "shared-accelerator"
duration = "15s"
drain = "2s"
seed = 1

[[flow.producers]]
name = "camera"
# Engines + server edges + 1 ("Choosing C" in the design note): 2 engines + 2 server edges + 1.
tokens = 5

[[flow.engines]]
name = "a"
location = "local"

[[flow.engines]]
name = "b"
location = "local"

[[flow.edges]]
from = "camera"
to = "a"
timeout = "1s"

[[flow.edges]]
from = "a"
to = "b"
timeout = "2s"

[producers.camera]
rate = 30
input_size = 65536

[engines.a]
service_time = { distribution = "constant", time = "50ms" }
pass_probability = 1.0
accelerator = "npu"

[engines.b]
service_time = { distribution = "constant", time = "500ms" }
accelerator = "npu"
