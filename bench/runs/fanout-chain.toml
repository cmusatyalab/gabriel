# A camera at 30 fps feeds F, with a heavy tail, and a chain of A then B. An input skipped at F
# still holds its token on the A -> B branch.
name = "fanout-chain"
duration = "30s"
drain = "2s"
seed = 1

[[flow.producers]]
name = "camera"
# Engines + server edges + 1 ("Choosing C" in the design note): 3 engines + 3 server edges + 1.
tokens = 7

[[flow.engines]]
name = "f"
location = "local"

[[flow.engines]]
name = "a"
location = "local"

[[flow.engines]]
name = "b"
location = "local"

[[flow.edges]]
from = "camera"
to = "f"
timeout = "5s"

[[flow.edges]]
from = "camera"
to = "a"
timeout = "5s"

[[flow.edges]]
from = "a"
to = "b"
timeout = "5s"

[producers.camera]
rate = 30
input_size = 65536

[engines.f]
service_time = { distribution = "lognormal", mean = "40ms", sd = "80ms" }

[engines.a]
service_time = { distribution = "constant", time = "50ms" }
pass_probability = 1.0

[engines.b]
service_time = { distribution = "constant", time = "200ms" }
