[package]
name = "gabriel-h264"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Gabriel engines that encode raw frames with H.264, and decode them, keyframe on gap"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gabriel = { path = "../../rust" }
gstreamer = { version = "0.25.4", features = ["v1_16"] }
gstreamer-app = { version = "0.25.2", features = ["v1_16"] }
gstreamer-video = { version = "0.25.4", features = ["v1_16"] }
protobuf = "3.7.2"
signal-hook = "0.4.5"

[build-dependencies]
protobuf-codegen = "3.7.2"
