[package]
name = "gabriel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Gabriel: token-based flow control over iceoryx2, exposed through a C ABI"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# cargo cinstall (cargo-c) installs the library as a C library: libgabriel, its header, and a
# gabriel.pc for pkg-config, which the Go bindings link through.
[features]
# Marks this as the workspace's C library for cargo-c; it enables nothing.
capi = []

[package.metadata.capi.header]
# build.rs already writes the header, so cargo-c installs that one instead of running cbindgen.
generation = false

[package.metadata.capi.pkg_config]
# Callers include <gabriel/gabriel.h>, so the include path is the directory above the header's.
strip_include_path_components = 1

[package.metadata.capi.install.include]
# Installed to include/gabriel/, the header's default subdirectory.
asset = [{ from = "include/gabriel/gabriel.h" }]

[dependencies]
iceoryx2 = "0.10"
thiserror = "2"
iceoryx2-bb-container = "0.10"
uuid = { version = "1.26.1", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
petgraph = { version = "0.8.3", default-features = false }
toml = "1.1.8"
humantime-serde = "1.1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
rustix = { version = "1.1.5", features = ["time"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
bytes = "1.12.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.53.2", features = ["rt", "sync", "macros", "time"] }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
rlimit = "0.11.0"
tempfile = "3.27.0"
