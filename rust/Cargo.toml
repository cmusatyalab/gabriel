[package]
name = "gabriel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Gabriel: token-based flow control over iceoryx2, exposed through a C ABI"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
iceoryx2 = "0.10"
thiserror = "2"
iceoryx2-bb-container = "0.10"
uuid = { version = "1.26.1", features = ["v4"] }

[build-dependencies]
cbindgen = "0.29"
