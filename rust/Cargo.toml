[package]
name = "gabriel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Gabriel: token-based flow control over iceoryx2, exposed through a C ABI"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
iceoryx2 = "0.10"
thiserror = "2"
iceoryx2-bb-container = "0.10"
uuid = { version = "1.26.1", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
petgraph = { version = "0.8.3", default-features = false }
toml = "1.1.8"
humantime-serde = "1.1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }

[build-dependencies]
cbindgen = "0.29"
