language = "C"
include_guard = "GABRIEL_H"
autogen_warning = "/* Generated by cbindgen from rust/src/ffi.rs. Do not edit by hand. */"
cpp_compat = true
style = "type"
usize_is_size_t = true

[export]
include = ["Status"]
# Internal limits that callers never need.
exclude = ["MAX_CHILDREN"]

[export.rename]
"Status" = "gabriel_status_t"
"Producer" = "gabriel_producer_t"
"Client" = "gabriel_client_t"
"Server" = "gabriel_server_t"
"Engine" = "gabriel_engine_t"
"InputIdView" = "gabriel_input_id_t"
"InputView" = "gabriel_input_t"
"Subscription" = "gabriel_subscription_t"
"EventView" = "gabriel_event_t"
"Reader" = "gabriel_reader_t"
"ReadInputView" = "gabriel_read_input_t"
"EventKindView" = "gabriel_event_kind_t"
"ForwardView" = "gabriel_forward_t"
"ClientOptions" = "gabriel_client_options_t"
"ServerOptions" = "gabriel_server_options_t"
"ABI_VERSION" = "GABRIEL_ABI_VERSION"
"MAX_FLOW_NAME" = "GABRIEL_MAX_FLOW_NAME"
"MAX_PAYLOAD_TYPE_NAME" = "GABRIEL_MAX_PAYLOAD_TYPE_NAME"
"MAX_ENGINE_NAME" = "GABRIEL_MAX_ENGINE_NAME"
"MAX_PRODUCER_NAME" = "GABRIEL_MAX_PRODUCER_NAME"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = false
