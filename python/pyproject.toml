[project]
name = "gabriel"
version = "0.1.0"
description = "Python bindings for Gabriel, through its C ABI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cffi>=1.17"]

[dependency-groups]
dev = ["pytest>=8", "numpy>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gabriel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
