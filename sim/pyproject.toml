[project]
name = "sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mihir Bala", email = "mkbala42@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aioquic>=1.3.0",
    "cryptography>=50.0.2",
    "iceoryx2>=0.10.0",
    "networkx>=3.7",
    "pyroute2>=0.9.6",
]

[project.scripts]
sim = "sim:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
