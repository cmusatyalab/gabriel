org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# AGP 9's "new DSL" and built-in Kotlin support are new as of this AGP
# generation, and third-party codegen plugins we depend on (the protobuf
# Gradle plugin, grpc-kotlin) don't yet have established compatibility with
# them. Both flags are the officially documented opt-outs (supported through
# AGP 10) that keep the classic, well-trodden org.jetbrains.kotlin.android +
# kotlinOptions wiring this project uses.
android.newDsl=false
android.builtInKotlin=false
